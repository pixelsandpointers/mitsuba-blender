name: Test suite

on:
  push:
    branches:
      - "*"
      - "!master"
  pull_request:
    branches: [ master ]
  workflow_call:

jobs:
  build:
    name: "${{ matrix.environment.os }} | Blender ${{ matrix.blender.version }}"
    runs-on: ${{ matrix.environment.os }}
    strategy:
      fail-fast: false
      matrix:
        environment:
        - {
          os: "ubuntu-latest",
          mitsuba-version: "3.8.0",
          pip-platform: "manylinux_2_28_x86_64"
        }
        - {
          os: "windows-latest",
          mitsuba-version: "3.8.0",
          pip-platform: "win_amd64"
        }
        blender:
        - { version: "5.0" }

    steps:
    - name: Git checkout
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4

    - name: Install Python dependencies
      run: python -m pip install --upgrade requests

    - name: Retrieve Blender full version
      id: blender-version
      shell: bash
      run: |
        echo "BLENDER_VERSION=$(python scripts/blender_downloader.py ${{ matrix.blender.version }} --print-version)" >> $GITHUB_OUTPUT

    - name: Cache Blender archive
      id: cache-blender
      uses: actions/cache@v3
      with:
        path: blender
        key: ${{ matrix.environment.os }}-${{ steps.blender-version.outputs.BLENDER_VERSION }}-v1

    - name: Download Blender
      if: steps.cache-blender.outputs.cache-hit != 'true'
      run: python scripts/blender_downloader.py ${{ matrix.blender.version }} -o blender

    - name: Install mitsuba into Blender Python
      shell: bash
      run: |
        BLENDER_PYTHON=$(find blender/ -regextype posix-extended -regex '.*bin\/python(.exe|[0-9].[0-9]{1,2}m?)' -print -quit)
        echo "Blender Python: $BLENDER_PYTHON"
        ./$BLENDER_PYTHON -m ensurepip
        ./$BLENDER_PYTHON -m pip install -U pip
        ./$BLENDER_PYTHON -m pip install --upgrade pytest pytest-cov
        ./$BLENDER_PYTHON -m pip install mitsuba==${{ matrix.environment.mitsuba-version }} \
          --platform ${{ matrix.environment.pip-platform }} \
          --python-version 311 \
          --only-binary=:all: \
          --force-reinstall

    - name: Run Addon test suite
      shell: bash
      run: |
        BLENDER_EXECUTABLE=$(find blender/ -maxdepth 1 -regextype posix-extended -regex '.*blender(.exe)?' -print -quit)
        echo "Blender Executable: $BLENDER_EXECUTABLE"
        ./$BLENDER_EXECUTABLE -b -noaudio --factory-startup --python scripts/run_tests.py -- -v --cov=mitsuba-blender
